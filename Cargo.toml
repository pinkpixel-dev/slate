[package]
name = "slate"
version = "1.0.0"
edition = "2024"
description = "A fast, minimal text editor for Linux, built with GPUI Kit"
license = "Apache-2.0"
authors = ["Pink Pixel <admin@pinkpixel.dev>"]
repository = "https://github.com/pinkpixel-dev/slate"
publish = false

[dependencies]
futures = "0.3"
gpui-kit = { version = "0.7.1", features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-lua",
    "tree-sitter-make",
    "tree-sitter-markdown",
    "tree-sitter-php",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
    "tree-sitter-zig",
] }
lsp-types = "0.97"
notify = "8.2.0"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[dev-dependencies]
gpui-kit = { version = "0.7.1", features = ["test-support"] }
